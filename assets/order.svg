<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title"><title id="title">East then north and north then east end at the same point</title><defs><marker id="a" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L17 9 L1 17 Z" fill="#2a6f97"/></marker><marker id="b" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L17 9 L1 17 Z" fill="#1e825b"/></marker><marker id="c" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L17 9 L1 17 Z" fill="#bd5537"/></marker><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#cbded0" stroke-width=".8" opacity=".6"/></pattern></defs><g font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-weight="500"><line x1="120" y1="280" x2="300" y2="280" stroke="#2a6f97" stroke-width="5" stroke-linecap="round" marker-end="url(#a)"/><line x1="300" y1="280" x2="300" y2="80" stroke="#1e825b" stroke-width="5" stroke-linecap="round" marker-end="url(#b)"/><line x1="120" y1="280" x2="120" y2="80" stroke="#1e825b" stroke-width="5" stroke-linecap="round" marker-end="url(#b)" stroke-dasharray="9 9"/><line x1="120" y1="80" x2="300" y2="80" stroke="#2a6f97" stroke-width="5" stroke-linecap="round" marker-end="url(#a)" stroke-dasharray="9 9"/><circle cx="120" cy="280" r="6" fill="#203b31"/><circle cx="300" cy="80" r="10" fill="#bd5537"/><text x="365" y="125" fill="#203b31" font-size="29" text-anchor="start">Same two steps.</text><text x="365" y="170" fill="#bd5537" font-size="29" text-anchor="start">Same finish.</text><text x="365" y="240" fill="#2a6f97" font-size="30" text-anchor="start">a + b = b + a</text><text x="210" y="328" fill="#2a6f97" font-size="24" text-anchor="middle">east</text><text x="50" y="185" fill="#1e825b" font-size="23" text-anchor="middle">north</text></g></svg>
