<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title"><title id="title">The length of an arrow gives the size; the tip shows the direction</title><defs><marker id="a" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L17 9 L1 17 Z" fill="#2a6f97"/></marker><marker id="b" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L17 9 L1 17 Z" fill="#1e825b"/></marker><marker id="c" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L17 9 L1 17 Z" fill="#bd5537"/></marker><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#cbded0" stroke-width=".8" opacity=".6"/></pattern></defs><g font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-weight="500"><line x1="120" y1="195" x2="590" y2="195" stroke="#2a6f97" stroke-width="5" stroke-linecap="round" marker-end="url(#a)"/><path d="M120 252v16H590v-16" fill="none" stroke="#cbded0" stroke-width="3"/><circle cx="120" cy="195" r="6" fill="#203b31"/><text x="120" y="160" fill="#5f7468" font-size="23" text-anchor="middle">tail</text><text x="590" y="160" fill="#2a6f97" font-size="23" text-anchor="middle">tip</text><text x="355" y="310" fill="#2a6f97" font-size="27" text-anchor="middle">length = size</text><text x="360" y="94" fill="#203b31" font-size="30" text-anchor="middle">5 metres to the east →</text></g></svg>
