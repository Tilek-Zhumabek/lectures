<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title"><title id="title">A swimmer moves across at 4 metres per second while the current carries them right at 3 metres per second</title><defs><marker id="a" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L17 9 L1 17 Z" fill="#2a6f97"/></marker><marker id="b" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L17 9 L1 17 Z" fill="#1e825b"/></marker><marker id="c" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L17 9 L1 17 Z" fill="#bd5537"/></marker><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#cbded0" stroke-width=".8" opacity=".6"/></pattern></defs><g font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-weight="500"><rect x="65" y="58" width="580" height="234" rx="16" fill="#daeeec"/><path d="M65 60H645M65 290H645" stroke="#72b6aa" stroke-width="5"/><g stroke="#a4d4d0" stroke-width="2"><path d="M85 110h55m325 20h65m-90 100h70M110 200h55m345-50h70"/></g><line x1="235" y1="270" x2="385" y2="270" stroke="#2a6f97" stroke-width="5" stroke-linecap="round" marker-end="url(#a)"/><line x1="235" y1="270" x2="235" y2="70" stroke="#1e825b" stroke-width="5" stroke-linecap="round" marker-end="url(#b)"/><line x1="235" y1="270" x2="385" y2="70" stroke="#bd5537" stroke-width="5" stroke-linecap="round" marker-end="url(#c)"/><circle cx="235" cy="270" r="6" fill="#203b31"/><text x="170" y="172" fill="#1e825b" font-size="26" text-anchor="middle">4 m/s</text><text x="335" y="320" fill="#2a6f97" font-size="24" text-anchor="middle">current: 3 m/s →</text><text x="387" y="175" fill="#bd5537" font-size="29" text-anchor="start">5 m/s</text><text x="360" y="39" fill="#5f7468" font-size="21" text-anchor="middle">far bank</text></g></svg>
