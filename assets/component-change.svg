<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 350" role="img" aria-labelledby="title"><title id="title">Subtract components separately: east change minus 20, north change plus 20 metres per second. The velocity change points north-west.</title><defs><marker id="blue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L13 7 L1 13 Z" fill="#2879a0"/></marker><marker id="green" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L13 7 L1 13 Z" fill="#1e825b"/></marker><marker id="coral" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L13 7 L1 13 Z" fill="#bd5537"/></marker><marker id="muted" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L13 7 L1 13 Z" fill="#5f7468"/></marker></defs><g font-family="Avenir Next, Segoe UI, Arial, sans-serif" fill="#203b31"><rect x="10" y="10" width="395" height="325" rx="16" fill="#fffbed" stroke="#cbded0" stroke-width="2"/><rect x="425" y="10" width="415" height="325" rx="16" fill="#e9f2ea" stroke="#cbded0" stroke-width="2"/><text x="208" y="47" font-size="26" fill="#203b31" text-anchor="middle">Draw the change</text><line x1="93" y1="260" x2="263" y2="260" stroke="#1e825b" stroke-width="5" marker-end="url(#green)"/><line x1="93" y1="260" x2="93" y2="90" stroke="#2879a0" stroke-width="5" marker-end="url(#blue)"/><line x1="263" y1="260" x2="93" y2="90" stroke="#bd5537" stroke-width="5" marker-end="url(#coral)"/><text x="169" y="296" font-size="23" fill="#1e825b" text-anchor="start">Before: (20, 0)</text><text x="114" y="100" font-size="23" fill="#2879a0" text-anchor="start">After: (0, 20)</text><path d="M263 260 L93 260 L93 90" fill="none" stroke="#bd5537" stroke-width="2" stroke-dasharray="5 5"/><text x="205" y="174" font-size="24" fill="#bd5537" text-anchor="start">Change</text><text x="93" y="319" font-size="19" fill="#203b31" text-anchor="start">East →</text><text x="28" y="76" font-size="19" fill="#203b31" text-anchor="start">North ↑</text><text x="448" y="47" font-size="23" fill="#203b31" text-anchor="start">After − before, in each direction</text><text x="448" y="105" font-size="26" fill="#203b31" text-anchor="start">East: 0 − 20 = −20 m/s</text><text x="448" y="153" font-size="26" fill="#203b31" text-anchor="start">North: 20 − 0 = +20 m/s</text><text x="448" y="218" font-size="28" fill="#bd5537" text-anchor="start">Δv = (−20, +20) m/s</text><text x="448" y="270" font-size="23" fill="#203b31" text-anchor="start">20 m/s west, 20 m/s north.</text><text x="448" y="307" font-size="21" fill="#203b31" text-anchor="start">Check: before + change = after.</text></g></svg>
