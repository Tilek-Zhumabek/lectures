<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title"><title id="title">Rain falls down in the ground frame; subtracting a rightward observer velocity gives a down-left relative velocity</title><defs><marker id="a" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L17 9 L1 17 Z" fill="#2a6f97"/></marker><marker id="b" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L17 9 L1 17 Z" fill="#1e825b"/></marker><marker id="c" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L17 9 L1 17 Z" fill="#bd5537"/></marker></defs><g font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-weight="500"><text x="205" y="35" fill="#203b31" font-size="27" text-anchor="middle">Standing still</text><text x="615" y="35" fill="#203b31" font-size="27" text-anchor="middle">Running right</text><line x1="120" y1="90" x2="120" y2="244" stroke="#2a6f97" stroke-width="4" marker-end="url(#a)"/><line x1="205" y1="90" x2="205" y2="244" stroke="#2a6f97" stroke-width="4" marker-end="url(#a)"/><line x1="290" y1="90" x2="290" y2="244" stroke="#2a6f97" stroke-width="4" marker-end="url(#a)"/><line x1="500" y1="90" x2="500" y2="244" stroke="#2a6f97" stroke-width="4" marker-end="url(#a)"/><line x1="500" y1="90" x2="662" y2="90" stroke="#1e825b" stroke-width="4" marker-end="url(#b)"/><line x1="662" y1="90" x2="500" y2="244" stroke="#bd5537" stroke-width="4" marker-end="url(#c)"/><text x="585" y="69" fill="#1e825b" font-size="22" text-anchor="start">you →</text><text x="635" y="209" fill="#bd5537" font-size="23" text-anchor="start">rain as</text><text x="635" y="239" fill="#bd5537" font-size="23" text-anchor="start">you see it</text><text x="205" y="308" fill="#5f7468" font-size="21" text-anchor="middle">Rain falls straight down.</text><text x="610" y="308" fill="#5f7468" font-size="21" text-anchor="middle">Subtract your velocity.</text></g></svg>
