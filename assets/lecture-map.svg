<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 345" role="img" aria-labelledby="title"><title id="title">Two parts: a short introduction, then equally sized addition and subtraction applications.</title><defs><marker id="blue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L13 7 L1 13 Z" fill="#2879a0"/></marker><marker id="green" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L13 7 L1 13 Z" fill="#1e825b"/></marker><marker id="coral" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L13 7 L1 13 Z" fill="#bd5537"/></marker><marker id="muted" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L13 7 L1 13 Z" fill="#5f7468"/></marker></defs><g font-family="Avenir Next, Segoe UI, Arial, sans-serif" fill="#203b31"><rect x="15" y="12" width="930" height="82" rx="16" fill="#fffbed" stroke="#cbded0" stroke-width="2"/><text x="40" y="47" font-size="23" fill="#203b31" text-anchor="start">PART 1 · INTRODUCTION</text><text x="40" y="78" font-size="25" fill="#203b31" text-anchor="start">Read an arrow. Describe it with components.</text><text x="915" y="49" font-size="22" fill="#203b31" text-anchor="end">A short start</text><text x="25" y="137" font-size="25" fill="#203b31" text-anchor="start">PART 2 · OUR MAIN WORK: VECTOR ARITHMETIC</text><rect x="15" y="159" width="450" height="169" rx="16" fill="#e9f2ea" stroke="#cbded0" stroke-width="2"/><text x="37" y="192" font-size="23" fill="#1e825b" text-anchor="start">A · ADDITION</text><text x="37" y="228" font-size="30" fill="#203b31" text-anchor="start">Combine motions</text><text x="37" y="265" font-size="21" fill="#203b31" text-anchor="start">Draw the sum → use components</text><text x="37" y="299" font-size="21" fill="#203b31" text-anchor="start">Apply it → try two problems</text><rect x="495" y="159" width="450" height="169" rx="16" fill="#e9f2ea" stroke="#cbded0" stroke-width="2"/><text x="517" y="192" font-size="23" fill="#bd5537" text-anchor="start">B · SUBTRACTION</text><text x="517" y="228" font-size="30" fill="#203b31" text-anchor="start">Find changes</text><text x="517" y="265" font-size="21" fill="#203b31" text-anchor="start">Draw the difference → use components</text><text x="517" y="299" font-size="21" fill="#203b31" text-anchor="start">Apply it → try two problems</text></g></svg>
