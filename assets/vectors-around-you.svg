<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 300" role="img" aria-labelledby="title"><title id="title">Six matching boxes: motion, forces, electricity, magnetism, general relativity with a velocity vector, and quantum mechanics with a state vector.</title><defs><marker id="blue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L13 7 L1 13 Z" fill="#2879a0"/></marker><marker id="green" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L13 7 L1 13 Z" fill="#1e825b"/></marker><marker id="coral" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L13 7 L1 13 Z" fill="#bd5537"/></marker><marker id="muted" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L13 7 L1 13 Z" fill="#5f7468"/></marker></defs><g font-family="Avenir Next, Segoe UI, Arial, sans-serif" fill="#203b31"><rect x="10" y="10" width="225" height="275" rx="16" fill="#fffbed" stroke="#cbded0" stroke-width="2"/><text x="122" y="46" font-size="19" fill="#203b31" text-anchor="middle">MOTION</text><path d="M30 205 Q70 150 125 155 T215 188" fill="none" stroke="#cbded0" stroke-width="3"/><circle cx="125" cy="155" r="10" fill="#2879a0"/><line x1="125" y1="155" x2="196" y2="155" stroke="#2879a0" stroke-width="5" marker-end="url(#blue)"/><text x="122" y="236" font-size="24" fill="#203b31" text-anchor="middle">Velocity vector</text><rect x="250" y="10" width="225" height="275" rx="16" fill="#e9f2ea" stroke="#cbded0" stroke-width="2"/><text x="362" y="46" font-size="19" fill="#203b31" text-anchor="middle">FORCES</text><rect x="295" y="113" width="70" height="68" rx="8" fill="#cfe0cf"/><line x1="330" y1="148" x2="437" y2="148" stroke="#1e825b" stroke-width="5" marker-end="url(#green)"/><text x="362" y="236" font-size="24" fill="#203b31" text-anchor="middle">Force vector</text><rect x="490" y="10" width="225" height="275" rx="16" fill="#fffbed" stroke="#cbded0" stroke-width="2"/><text x="602" y="46" font-size="19" fill="#203b31" text-anchor="middle">ELECTRICITY</text><circle cx="548" cy="148" r="24" fill="#e3eef4"/><text x="548" y="157" font-size="30" fill="#203b31" text-anchor="middle">+</text><circle cx="602" cy="148" r="5" fill="#2879a0"/><line x1="602" y1="148" x2="685" y2="148" stroke="#2879a0" stroke-width="5" marker-end="url(#blue)"/><text x="602" y="223" font-size="23" fill="#203b31" text-anchor="middle">Electric field</text><text x="602" y="250" font-size="23" fill="#203b31" text-anchor="middle">vector</text><rect x="730" y="10" width="225" height="275" rx="16" fill="#e9f2ea" stroke="#cbded0" stroke-width="2"/><text x="842" y="46" font-size="19" fill="#203b31" text-anchor="middle">MAGNETISM</text><rect x="758" y="133" width="70" height="32" rx="5" fill="#cfe0cf"/><text x="770" y="156" font-size="20" fill="#203b31" text-anchor="start">S</text><text x="805" y="156" font-size="20" fill="#203b31" text-anchor="start">N</text><circle cx="850" cy="148" r="5" fill="#1e825b"/><line x1="850" y1="148" x2="930" y2="148" stroke="#1e825b" stroke-width="5" marker-end="url(#green)"/><text x="842" y="223" font-size="23" fill="#203b31" text-anchor="middle">Magnetic field</text><text x="842" y="250" font-size="23" fill="#203b31" text-anchor="middle">vector</text>
