<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title"><title id="title">Acceleration perpendicular to velocity changes direction; a parallel component changes speed</title><defs><marker id="a" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L17 9 L1 17 Z" fill="#2a6f97"/></marker><marker id="b" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L17 9 L1 17 Z" fill="#1e825b"/></marker><marker id="c" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L17 9 L1 17 Z" fill="#bd5537"/></marker></defs><g font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-weight="500"><text x="200" y="37" fill="#203b31" font-size="25" text-anchor="middle">Change direction</text><text x="600" y="37" fill="#203b31" font-size="25" text-anchor="middle">Change speed</text><line x1="85" y1="235" x2="325" y2="235" stroke="#2a6f97" stroke-width="4" marker-end="url(#a)"/><line x1="180" y1="235" x2="180" y2="103" stroke="#bd5537" stroke-width="4" marker-end="url(#c)"/><text x="200" y="288" fill="#2a6f97" font-size="24" text-anchor="middle">velocity</text><text x="220" y="125" fill="#bd5537" font-size="21" text-anchor="start">acceleration</text><line x1="480" y1="235" x2="720" y2="235" stroke="#2a6f97" stroke-width="4" marker-end="url(#a)"/><line x1="510" y1="161" x2="698" y2="161" stroke="#bd5537" stroke-width="4" marker-end="url(#c)"/><text x="600" y="288" fill="#2a6f97" font-size="24" text-anchor="middle">velocity</text><text x="600" y="118" fill="#bd5537" font-size="22" text-anchor="middle">acceleration</text><text x="200" y="335" fill="#5f7468" font-size="22" text-anchor="middle">perpendicular</text><text x="600" y="335" fill="#5f7468" font-size="22" text-anchor="middle">parallel</text></g></svg>
