<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title"><title id="title">Walk 3 kilometres east, 4 north, then 3 west. You end 4 kilometres north of your start.</title><defs><marker id="a" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L17 9 L1 17 Z" fill="#2a6f97"/></marker><marker id="b" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L17 9 L1 17 Z" fill="#1e825b"/></marker><marker id="c" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L17 9 L1 17 Z" fill="#bd5537"/></marker><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#cbded0" stroke-width=".8" opacity=".6"/></pattern></defs><g font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-weight="500"><line x1="180" y1="290" x2="360" y2="290" stroke="#2a6f97" stroke-width="5" stroke-linecap="round" marker-end="url(#a)"/><line x1="360" y1="290" x2="360" y2="50" stroke="#1e825b" stroke-width="5" stroke-linecap="round" marker-end="url(#b)"/><line x1="360" y1="50" x2="180" y2="50" stroke="#2a6f97" stroke-width="5" stroke-linecap="round" marker-end="url(#a)"/><line x1="180" y1="290" x2="180" y2="50" stroke="#bd5537" stroke-width="5" stroke-linecap="round" marker-end="url(#c)" stroke-dasharray="9 9"/><circle cx="180" cy="290" r="6" fill="#203b31"/><text x="270" y="334" fill="#2a6f97" font-size="24" text-anchor="middle">3 km east</text><text x="400" y="178" fill="#1e825b" font-size="24" text-anchor="start">4 km north</text><text x="270" y="27" fill="#2a6f97" font-size="24" text-anchor="middle">3 km west</text><text x="132" y="180" fill="#bd5537" font-size="42" text-anchor="middle">?</text><text x="132" y="294" fill="#5f7468" font-size="22" text-anchor="middle">start</text></g></svg>
