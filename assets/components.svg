<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title"><title id="title">A 5 metre vector can be described by a 3 metre east component and a 4 metre north component</title><defs><marker id="a" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L17 9 L1 17 Z" fill="#2a6f97"/></marker><marker id="b" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L17 9 L1 17 Z" fill="#1e825b"/></marker><marker id="c" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L17 9 L1 17 Z" fill="#bd5537"/></marker><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#cbded0" stroke-width=".8" opacity=".6"/></pattern></defs><g font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-weight="500"><line x1="210" y1="285" x2="390" y2="285" stroke="#2a6f97" stroke-width="5" stroke-linecap="round" marker-end="url(#a)" stroke-dasharray="9 9"/><line x1="390" y1="285" x2="390" y2="45" stroke="#1e825b" stroke-width="5" stroke-linecap="round" marker-end="url(#b)" stroke-dasharray="9 9"/><line x1="210" y1="285" x2="390" y2="45" stroke="#bd5537" stroke-width="5" stroke-linecap="round" marker-end="url(#c)"/><circle cx="210" cy="285" r="6" fill="#203b31"/><text x="294" y="330" fill="#2a6f97" font-size="25" text-anchor="middle">3 m east</text><text x="420" y="164" fill="#1e825b" font-size="25" text-anchor="start">4 m north</text><text x="166" y="174" fill="#bd5537" font-size="29" text-anchor="middle">5 m</text><text x="75" y="51" fill="#203b31" font-size="27" text-anchor="start">One arrow.</text><text x="75" y="84" fill="#5f7468" font-size="23" text-anchor="start">Two parts.</text></g></svg>
