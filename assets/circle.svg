<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title"><title id="title">A car travelling anticlockwise around a circle has upward velocity at the right and leftward velocity at the top</title><defs><marker id="a" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L17 9 L1 17 Z" fill="#2a6f97"/></marker><marker id="b" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L17 9 L1 17 Z" fill="#1e825b"/></marker><marker id="c" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L17 9 L1 17 Z" fill="#bd5537"/></marker><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#cbded0" stroke-width=".8" opacity=".6"/></pattern></defs><g font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-weight="500"><circle cx="285" cy="200" r="125" fill="#d5e8d6" stroke="#a7c4ae" stroke-width="3"/><circle cx="285" cy="200" r="87" fill="#eff6ed"/><path d="M285 200H410M285 200V75" stroke="#a7c4ae" stroke-dasharray="5 7" stroke-width="2"/><circle cx="410" cy="200" r="6" fill="#203b31"/><circle cx="285" cy="75" r="6" fill="#203b31"/><line x1="410" y1="200" x2="410" y2="70" stroke="#2a6f97" stroke-width="5" stroke-linecap="round" marker-end="url(#a)"/><line x1="285" y1="75" x2="155" y2="75" stroke="#1e825b" stroke-width="5" stroke-linecap="round" marker-end="url(#b)"/><text x="432" y="133" fill="#2a6f97" font-size="27" text-anchor="start">5 m/s</text><text x="195" y="42" fill="#1e825b" font-size="27" text-anchor="middle">5 m/s</text><text x="285" y="209" fill="#5f7468" font-size="22" text-anchor="middle">turning</text><text x="517" y="253" fill="#203b31" font-size="25" text-anchor="middle">Same speed.</text><text x="517" y="292" fill="#bd5537" font-size="25" text-anchor="middle">New direction.</text></g></svg>
