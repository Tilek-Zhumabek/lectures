<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title">
  <title id="title">Adding tip to tail and completing a parallelogram give the same resultant</title>
  <defs>
    <marker id="a" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L17 9 L1 17 Z" fill="#2a6f97"/>
    </marker>
    <marker id="b" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L17 9 L1 17 Z" fill="#1e825b"/>
    </marker>
    <marker id="c" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L17 9 L1 17 Z" fill="#bd5537"/>
    </marker>
  </defs>
  <g font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-weight="500">
    <text x="202" y="34" fill="#203b31" font-size="26" text-anchor="middle">Tip to tail</text>
    <text x="608" y="34" fill="#203b31" font-size="26" text-anchor="middle">Parallelogram</text>
    <line x1="92" y1="284" x2="252" y2="284" stroke="#2a6f97" stroke-width="4" marker-end="url(#a)"/>
    <line x1="252" y1="284" x2="252" y2="104" stroke="#1e825b" stroke-width="4" marker-end="url(#b)"/>
    <line x1="92" y1="284" x2="252" y2="104" stroke="#bd5537" stroke-width="4" marker-end="url(#c)"/>
    <circle cx="92" cy="284" r="5" fill="#203b31"/>
    <text x="172" y="326" fill="#2a6f97" font-size="26" text-anchor="middle">a</text>
    <text x="278" y="204" fill="#1e825b" font-size="26" text-anchor="start">b</text>
    <text x="128" y="182" fill="#bd5537" font-size="24" text-anchor="start">a + b</text>
    <line x1="480" y1="284" x2="640" y2="284" stroke="#2a6f97" stroke-width="4" marker-end="url(#a)"/>
    <line x1="480" y1="284" x2="480" y2="104" stroke="#1e825b" stroke-width="4" marker-end="url(#b)"/>
    <line x1="640" y1="284" x2="640" y2="104" stroke="#1e825b" stroke-width="4" marker-end="url(#b)" stroke-dasharray="7 6"/>
    <line x1="480" y1="104" x2="640" y2="104" stroke="#2a6f97" stroke-width="4" marker-end="url(#a)" stroke-dasharray="7 6"/>
    <line x1="480" y1="284" x2="640" y2="104" stroke="#bd5537" stroke-width="4" marker-end="url(#c)"/>
    <circle cx="480" cy="284" r="5" fill="#203b31"/>
    <text x="560" y="326" fill="#2a6f97" font-size="26" text-anchor="middle">a</text>
    <text x="447" y="204" fill="#1e825b" font-size="26" text-anchor="start">b</text>
    <text x="545" y="181" fill="#bd5537" font-size="24" text-anchor="start">a + b</text>
  </g>
</svg>
