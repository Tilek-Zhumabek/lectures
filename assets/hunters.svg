<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title"><title id="title">Two flying arrows do not merge, while successive displacements of one person have a resultant</title><defs><marker id="a" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L17 9 L1 17 Z" fill="#2a6f97"/></marker><marker id="b" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L17 9 L1 17 Z" fill="#1e825b"/></marker><marker id="c" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L17 9 L1 17 Z" fill="#bd5537"/></marker></defs><g font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-weight="500"><text x="210" y="35" fill="#203b31" font-size="25" text-anchor="middle">Two arrows in flight</text><text x="615" y="35" fill="#203b31" font-size="25" text-anchor="middle">One person's walk</text><line x1="140" y1="269" x2="320" y2="269" stroke="#2a6f97" stroke-width="4" marker-end="url(#a)"/><line x1="140" y1="269" x2="140" y2="98" stroke="#1e825b" stroke-width="4" marker-end="url(#b)"/><circle cx="140" cy="269" r="5" fill="#203b31"/><text x="329" y="90" fill="#bd5537" font-size="23" text-anchor="middle">deer</text><circle cx="330" cy="108" r="8" fill="#bd5537"/><text x="210" y="328" fill="#5f7468" font-size="20" text-anchor="middle">Neither arrow goes diagonally.</text><line x1="485" y1="269" x2="665" y2="269" stroke="#2a6f97" stroke-width="4" marker-end="url(#a)"/><line x1="665" y1="269" x2="665" y2="98" stroke="#1e825b" stroke-width="4" marker-end="url(#b)"/><line x1="485" y1="269" x2="665" y2="98" stroke="#bd5537" stroke-width="4" marker-end="url(#c)"/><circle cx="485" cy="269" r="5" fill="#203b31"/><text x="620" y="328" fill="#5f7468" font-size="20" text-anchor="middle">A sum describes the displacement.</text></g></svg>
