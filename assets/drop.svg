<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title"><title id="title">A dropped ball and a ball launched horizontally from the same height fall equal vertical distances in equal times</title><defs><marker id="a" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L17 9 L1 17 Z" fill="#2a6f97"/></marker><marker id="b" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L17 9 L1 17 Z" fill="#1e825b"/></marker><marker id="c" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L17 9 L1 17 Z" fill="#bd5537"/></marker><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#cbded0" stroke-width=".8" opacity=".6"/></pattern></defs><g font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-weight="500"><path d="M90 77H350" stroke="#a7c4ae" stroke-width="6"/><path d="M75 295H650" stroke="#a7c4ae" stroke-width="4"/><path d="M160 90V280M330 90Q440 90 605 280" fill="none" stroke="#adc9b5" stroke-width="2" stroke-dasharray="5 7"/><g fill="#2a6f97"><circle cx="160" cy="95" r="10"/><circle cx="160" cy="116" r="10"/><circle cx="160" cy="178" r="10"/><circle cx="160" cy="280" r="10"/></g><g fill="#1e825b"><circle cx="330" cy="95" r="10"/><circle cx="422" cy="116" r="10"/><circle cx="513" cy="178" r="10"/><circle cx="605" cy="280" r="10"/></g><path d="M175 178H495" stroke="#bd5537" stroke-width="2" stroke-dasharray="5 8"/><text x="160" y="40" fill="#2a6f97" font-size="26" text-anchor="middle">dropped</text><text x="435" y="40" fill="#1e825b" font-size="26" text-anchor="middle">launched sideways</text><text x="355" y="219" fill="#bd5537" font-size="22" text-anchor="middle">same height at the same time</text><text x="360" y="340" fill="#5f7468" font-size="22" text-anchor="middle">Both start with zero vertical speed.</text></g></svg>
