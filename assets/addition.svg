<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title"><title id="title">Walk 3 kilometres east, then 4 kilometres north. Displacement is 5 kilometres diagonally.</title><defs><marker id="a" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L17 9 L1 17 Z" fill="#2a6f97"/></marker><marker id="b" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L17 9 L1 17 Z" fill="#1e825b"/></marker><marker id="c" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L17 9 L1 17 Z" fill="#bd5537"/></marker><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#cbded0" stroke-width=".8" opacity=".6"/></pattern></defs><g font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-weight="500"><rect x="130" y="25" width="400" height="310" fill="url(#grid)" rx="12"/><line x1="210" y1="285" x2="390" y2="285" stroke="#2a6f97" stroke-width="5" stroke-linecap="round" marker-end="url(#a)"/><line x1="390" y1="285" x2="390" y2="45" stroke="#1e825b" stroke-width="5" stroke-linecap="round" marker-end="url(#b)"/><line x1="210" y1="285" x2="390" y2="45" stroke="#bd5537" stroke-width="5" stroke-linecap="round" marker-end="url(#c)"/><circle cx="210" cy="285" r="6" fill="#203b31"/><text x="280" y="330" fill="#2a6f97" font-size="25" text-anchor="middle">3 km east</text><text x="416" y="166" fill="#1e825b" font-size="25" text-anchor="start">4 km north</text><text x="171" y="192" fill="#bd5537" font-size="28" text-anchor="middle">5 km</text><text x="196" y="271" fill="#5f7468" font-size="19" text-anchor="end">start</text><text x="415" y="48" fill="#5f7468" font-size="19" text-anchor="start">finish</text></g></svg>
