<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 385" role="img" aria-labelledby="title"><title id="title">Two drawings of a minus b: add reversed b to a, or draw from the tip of b to the tip of a with shared tails.</title><defs><marker id="blue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L13 7 L1 13 Z" fill="#2879a0"/></marker><marker id="green" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L13 7 L1 13 Z" fill="#1e825b"/></marker><marker id="coral" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L13 7 L1 13 Z" fill="#bd5537"/></marker><marker id="muted" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L13 7 L1 13 Z" fill="#5f7468"/></marker></defs><g font-family="Avenir Next, Segoe UI, Arial, sans-serif" fill="#203b31"><rect x="10" y="10" width="405" height="320" rx="16" fill="#fffbed" stroke="#cbded0" stroke-width="2"/><rect x="435" y="10" width="405" height="320" rx="16" fill="#e9f2ea" stroke="#cbded0" stroke-width="2"/><text x="212" y="46" font-size="26" fill="#203b31" text-anchor="middle">Reverse, then add</text><text x="637" y="46" font-size="26" fill="#203b31" text-anchor="middle">Or put the tails together</text><line x1="267" y1="265" x2="267" y2="100" stroke="#2879a0" stroke-width="5" marker-end="url(#blue)"/><line x1="267" y1="100" x2="102" y2="100" stroke="#1e825b" stroke-width="5" marker-end="url(#green)"/><line x1="267" y1="265" x2="102" y2="100" stroke="#bd5537" stroke-width="5" marker-end="url(#coral)"/><text x="282" y="188" font-size="26" fill="#2879a0" text-anchor="start">a</text><text x="172" y="85" font-size="26" fill="#1e825b" text-anchor="start">−b</text><text x="87" y="207" font-size="26" fill="#bd5537" text-anchor="start">a − b</text><line x1="560" y1="265" x2="725" y2="265" stroke="#1e825b" stroke-width="5" marker-end="url(#green)"/><line x1="560" y1="265" x2="560" y2="100" stroke="#2879a0" stroke-width="5" marker-end="url(#blue)"/><line x1="725" y1="265" x2="560" y2="100" stroke="#bd5537" stroke-width="5" marker-end="url(#coral)"/><text x="639" y="296" font-size="26" fill="#1e825b" text-anchor="start">b</text><text x="533" y="188" font-size="26" fill="#2879a0" text-anchor="start">a</text><text x="663" y="174" font-size="26" fill="#bd5537" text-anchor="start">a − b</text><text x="425" y="365" font-size="27" fill="#203b31" text-anchor="middle">Same difference: b + (a − b) = a</text></g></svg>
