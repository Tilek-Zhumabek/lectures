<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title"><title id="title">Three bags of two red and three green apples give six red and nine green apples</title><defs><marker id="a" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L17 9 L1 17 Z" fill="#2a6f97"/></marker><marker id="b" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L17 9 L1 17 Z" fill="#1e825b"/></marker><marker id="c" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L17 9 L1 17 Z" fill="#bd5537"/></marker></defs><g font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-weight="500"><rect x="52" y="45" width="205" height="118" rx="15" fill="#fff" stroke="#cbded0" stroke-width="2"/><circle cx="81" cy="105" r="12" fill="#bd5537"/><path d="M81 95q-2-9 5-13" fill="none" stroke="#52683f" stroke-width="3"/><circle cx="117" cy="105" r="12" fill="#bd5537"/><path d="M117 95q-2-9 5-13" fill="none" stroke="#52683f" stroke-width="3"/><circle cx="153" cy="105" r="12" fill="#358657"/><path d="M153 95q-2-9 5-13" fill="none" stroke="#52683f" stroke-width="3"/><circle cx="189" cy="105" r="12" fill="#358657"/><path d="M189 95q-2-9 5-13" fill="none" stroke="#52683f" stroke-width="3"/><circle cx="225" cy="105" r="12" fill="#358657"/><path d="M225 95q-2-9 5-13" fill="none" stroke="#52683f" stroke-width="3"/><text x="154" y="193" fill="#5f7468" font-size="22" text-anchor="middle">2 red + 3 green</text><rect x="290" y="45" width="205" height="118" rx="15" fill="#fff" stroke="#cbded0" stroke-width="2"/><circle cx="319" cy="105" r="12" fill="#bd5537"/><path d="M319 95q-2-9 5-13" fill="none" stroke="#52683f" stroke-width="3"/><circle cx="355" cy="105" r="12" fill="#bd5537"/><path d="M355 95q-2-9 5-13" fill="none" stroke="#52683f" stroke-width="3"/><circle cx="391" cy="105" r="12" fill="#358657"/><path d="M391 95q-2-9 5-13" fill="none" stroke="#52683f" stroke-width="3"/><circle cx="427" cy="105" r="12" fill="#358657"/><path d="M427 95q-2-9 5-13" fill="none" stroke="#52683f" stroke-width="3"/><circle cx="463" cy="105" r="12" fill="#358657"/><path d="M463 95q-2-9 5-13" fill="none" stroke="#52683f" stroke-width="3"/><text x="392" y="193" fill="#5f7468" font-size="22" text-anchor="middle">2 red + 3 green</text><rect x="528" y="45" width="205" height="118" rx="15" fill="#fff" stroke="#cbded0" stroke-width="2"/><circle cx="557" cy="105" r="12" fill="#bd5537"/><path d="M557 95q-2-9 5-13" fill="none" stroke="#52683f" stroke-width="3"/><circle cx="593" cy="105" r="12" fill="#bd5537"/><path d="M593 95q-2-9 5-13" fill="none" stroke="#52683f" stroke-width="3"/><circle cx="629" cy="105" r="12" fill="#358657"/><path d="M629 95q-2-9 5-13" fill="none" stroke="#52683f" stroke-width="3"/><circle cx="665" cy="105" r="12" fill="#358657"/><path d="M665 95q-2-9 5-13" fill="none" stroke="#52683f" stroke-width="3"/><circle cx="701" cy="105" r="12" fill="#358657"/><path d="M701 95q-2-9 5-13" fill="none" stroke="#52683f" stroke-width="3"/><text x="630" y="193" fill="#5f7468" font-size="22" text-anchor="middle">2 red + 3 green</text><text x="400" y="258" fill="#203b31" font-size="36" text-anchor="middle">3 × (2 + 3) = 6 + 9 = 15</text><text x="400" y="313" fill="#5f7468" font-size="23" text-anchor="middle">Count by bag, or count by colour.</text></g></svg>
