<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title"><title id="title">With tails together, draw the change from the tip of the old velocity to the tip of the new velocity</title><defs><marker id="a" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L17 9 L1 17 Z" fill="#2a6f97"/></marker><marker id="b" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L17 9 L1 17 Z" fill="#1e825b"/></marker><marker id="c" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L17 9 L1 17 Z" fill="#bd5537"/></marker><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#cbded0" stroke-width=".8" opacity=".6"/></pattern></defs><g font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-weight="500"><line x1="230" y1="285" x2="450" y2="285" stroke="#2a6f97" stroke-width="5" stroke-linecap="round" marker-end="url(#a)"/><line x1="230" y1="285" x2="230" y2="65" stroke="#1e825b" stroke-width="5" stroke-linecap="round" marker-end="url(#b)"/><line x1="450" y1="285" x2="230" y2="65" stroke="#bd5537" stroke-width="5" stroke-linecap="round" marker-end="url(#c)"/><circle cx="230" cy="285" r="6" fill="#203b31"/><text x="350" y="330" fill="#2a6f97" font-size="26" text-anchor="middle">before →</text><text x="110" y="160" fill="#1e825b" font-size="26" text-anchor="middle">after ↑</text><text x="425" y="160" fill="#bd5537" font-size="29" text-anchor="start">change</text><text x="425" y="197" fill="#5f7468" font-size="21" text-anchor="start">before tip</text><text x="425" y="224" fill="#5f7468" font-size="21" text-anchor="start">to after tip</text><text x="230" y="35" fill="#1e825b" font-size="20" text-anchor="middle">new tip</text></g></svg>
